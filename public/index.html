<!doctype html>
<html lang="en" data-theme="preferred_color_scheme">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Set up comments | giscusflare</title>
  <link rel="stylesheet" href="/widget.css">
  <link rel="stylesheet" href="/setup.css">
</head>
<body>
  <main class="setup">
    <h1>Set up comments</h1>
    <form id="setup-form">
      <label>Public GitHub repository
        <input name="repo" placeholder="owner/repository" required>
      </label>
      <label>Website URL
        <input name="origin" type="url" placeholder="https://your-blog.example" required>
      </label>
      <label>Match pages by
        <select name="mapping">
          <option value="pathname">Page path</option>
          <option value="url">Page URL</option>
          <option value="title">Page title</option>
          <option value="og:title">Open Graph title</option>
          <option value="specific">Specific term</option>
          <option value="number">Discussion number</option>
        </select>
      </label>
      <label id="mapping-value" hidden>
        <span id="mapping-value-label">Search term</span>
        <input name="term" disabled>
      </label>
      <label>Color scheme
        <select name="theme">
          <option value="preferred_color_scheme">Automatic</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Comment box
        <select name="position">
          <option value="bottom">Below comments</option>
          <option value="top">Above comments</option>
        </select>
      </label>
      <div id="strict-setting">
        <label class="check"><input name="strict" type="checkbox" aria-describedby="strict-help">Use strict matching</label>
        <small id="strict-help">Matches the page identifier exactly instead of searching discussion titles.</small>
      </div>
      <button class="primary" type="submit">Generate embed code</button>
    </form>
    <p id="setup-status" role="status"></p>
    <section id="setup-result" hidden>
      <h2>Embed code</h2>
      <p>Paste this script where comments should appear.</p>
      <pre><code id="setup-code"></code></pre>
      <button id="setup-copy" type="button" aria-live="polite">Copy code</button>
      <p id="copy-status" role="status"></p>
    </section>
    <footer>giscusflare. Independent rebuild of <a href="https://giscus.app" target="_blank" rel="noopener noreferrer">giscus</a>.</footer>
  </main>
  <script type="module" src="/setup.js"></script>
</body>
</html>
